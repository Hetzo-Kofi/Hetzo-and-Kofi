<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
        }
        header {
            background: #24292e;
            color: #fff;
            padding: 2rem 1rem;
        }
        main {
            padding: 2rem;
            max-width: 800px;
            margin: auto;
            background: #fff;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
            margin-top: 2rem;
            border-radius: 8px;
        }
        .ad-space {
            margin: 2rem 0;
            padding: 1rem;
            background: #eef;
            border: 2px dashed #99f;
            border-radius: 5px;
        }
        footer {
            margin-top: 2rem;
            padding: 1rem;
            color: #777;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
        <p>Hosted for free on GitHub Pages!</p>
    </header>

    <main>
        <h2>About This Site</h2>
        <p>This is a simple template to help you get started. You can edit this text, add images, and deploy your site in minutes.</p>

        <!-- Placeholder for Google AdSense or Ads in the future -->
        <div class="ad-space">
            <p><em>[ Your Google AdSense Code Goes Here ]</em></p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 My GitHub Project. All rights reserved.</p>
    </footer>

</body>
</html>
